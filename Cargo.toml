[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clemPerrousset/a11y-report"
homepage = "https://github.com/clemPerrousset/a11y-report"
authors = ["Clément Perrousset"]
keywords = ["accessibility", "a11y", "android", "wcag", "audit"]
categories = ["command-line-utilities", "accessibility", "development-tools"]

[workspace.dependencies]
a11y-report-core = { path = "crates/a11y-report-core", version = "0.1.0" }
a11y-report-android = { path = "crates/a11y-report-android", version = "0.1.0" }
a11y-report-rules = { path = "crates/a11y-report-rules", version = "0.1.0" }
a11y-report-render = { path = "crates/a11y-report-render", version = "0.1.0" }

roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
blake3 = "1"
globset = "0.4"
askama = "0.16"
base64 = "0.23"
insta = { version = "1", features = ["json"] }
proptest = "1"
criterion = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
